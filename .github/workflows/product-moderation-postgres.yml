name: Product and harvest moderation PostgreSQL integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*guard_product_insert_status.sql"
      - "supabase/migrations/*create_harvest_listings.sql"
      - "supabase/migrations/*reconcile_harvest_listing_policies.sql"
      - "supabase/migrations/*remove_harvest_admin_approval.sql"
      - "supabase/migrations/*harden_harvest_moderation.sql"
      - "supabase/migrations/*revoke_client_truncate_privileges.sql"
      - "supabase/tests/security_truncate_privileges.sql"
      - "scripts/test-truncate-defaults.sql"
      - "scripts/test-product-insert-moderation.sql"
      - "scripts/test-harvest-listings.sql"
      - ".github/workflows/product-moderation-postgres.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*guard_product_insert_status.sql"
      - "supabase/migrations/*create_harvest_listings.sql"
      - "supabase/migrations/*reconcile_harvest_listing_policies.sql"
      - "supabase/migrations/*revoke_client_truncate_privileges.sql"
      - "supabase/tests/security_truncate_privileges.sql"
      - "scripts/test-product-insert-moderation.sql"
      - "scripts/test-harvest-listings.sql"
      - ".github/workflows/product-moderation-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test product moderation trigger against PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-product-insert-moderation.sql
      - name: Test harvest listing RLS, privacy, upload ownership and immediate publication
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-harvest-listings.sql
      - name: Test client TRUNCATE privilege revocation
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE supabase_admin NOLOGIN;
          CREATE SCHEMA storage;
          CREATE SCHEMA graphql;
          CREATE SCHEMA graphql_public;
          CREATE TABLE public.buyer_demands(id bigint);
          CREATE TABLE public.transport_bookings(id bigint);
          CREATE TABLE storage.objects(id bigint);
          CREATE TABLE graphql.existing_table(id bigint);
          CREATE TABLE graphql_public.existing_table(id bigint);
          GRANT TRUNCATE ON ALL TABLES IN SCHEMA public, storage, graphql, graphql_public TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public GRANT TRUNCATE ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA storage GRANT TRUNCATE ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA public GRANT TRUNCATE ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA graphql GRANT TRUNCATE ON TABLES TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES FOR ROLE supabase_admin IN SCHEMA graphql_public GRANT TRUNCATE ON TABLES TO anon, authenticated;
          GRANT CREATE ON SCHEMA public, storage, graphql, graphql_public TO supabase_admin;
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030181320_revoke_client_truncate_privileges.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261030235300_revoke_client_truncate_privileges.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/security_truncate_privileges.sql
          psql -v ON_ERROR_STOP=1 -f scripts/test-truncate-defaults.sql

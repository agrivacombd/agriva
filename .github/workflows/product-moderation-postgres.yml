name: Product and harvest moderation PostgreSQL integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/*guard_product_insert_status.sql"
      - "supabase/migrations/*create_harvest_listings.sql"
      - "supabase/migrations/*reconcile_harvest_listing_policies.sql"
      - "supabase/migrations/*remove_harvest_admin_approval.sql"
      - "supabase/migrations/*harden_harvest_moderation.sql"
      - "scripts/test-product-insert-moderation.sql"
      - "scripts/test-harvest-listings.sql"
      - ".github/workflows/product-moderation-postgres.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/*guard_product_insert_status.sql"
      - "supabase/migrations/*create_harvest_listings.sql"
      - "supabase/migrations/*reconcile_harvest_listing_policies.sql"
      - "scripts/test-product-insert-moderation.sql"
      - "scripts/test-harvest-listings.sql"
      - ".github/workflows/product-moderation-postgres.yml"

permissions:
  contents: read

jobs:
  postgres-trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test product moderation trigger against PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-product-insert-moderation.sql
      - name: Test harvest listing RLS, privacy, upload ownership and immediate publication
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: psql -v ON_ERROR_STOP=1 -f scripts/test-harvest-listings.sql

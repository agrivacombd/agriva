name: Staging editorial HTTP security
on:
  pull_request:
    paths:
      - 'scripts/test-staging-editorial-http.mjs'
      - '.github/workflows/staging-editorial-http.yml'
  workflow_dispatch:
    inputs:
      full_http_test:
        description: 'Run authenticated 403/428/409 checks (requires staging-only cookies and disposable article ID)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  staging-http:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check staging API response
        env:
          STAGING_BASE_URL: https://agriva-p8g6-4dupjyari-agriva1.vercel.app
          STAGING_FULL_HTTP_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.full_http_test || false }}
          STAGING_ADMIN_COOKIE: ${{ secrets.STAGING_ADMIN_COOKIE }}
          STAGING_NONADMIN_COOKIE: ${{ secrets.STAGING_NONADMIN_COOKIE }}
          STAGING_TEST_ARTICLE_ID: ${{ vars.STAGING_TEST_ARTICLE_ID }}
        run: node scripts/test-staging-editorial-http.mjs

name: AGRIVA Bulk Crop Autocomplete Checks
on:
  pull_request:
    paths:
      - 'components/bulk-rfq/**'
      - 'lib/bulk-rfq/**'
      - 'app/custom-order/page.tsx'
      - 'scripts/smoke-bulk-crop-suggestions.mjs'
      - 'scripts/smoke-bulk-order-custom-units.mjs'
      - 'app/account/custom-orders/**'
      - 'app/bulk-orders/**'
      - 'app/wholesaler/**'
      - 'components/marketplace/BuyerDemandBoard.tsx'
      - 'components/marketplace/BuyerDemandRfqConversion.tsx'
      - 'app/api/buyer-demands/convert-to-rfq/route.ts'
      - 'lib/http/read-limited-body.mjs'
      - 'lib/http/read-limited-body.d.mts'
      - 'scripts/test-read-limited-body.mjs'
      - 'scripts/smoke-buyer-demand-privacy.mjs'
      - 'scripts/smoke-buyer-demand-rfq-conversion.mjs'
      - 'scripts/smoke-buyer-demand-rfq-transaction.mjs'
      - 'scripts/smoke-buyer-demand-rfq-ui-api.mjs'
      - 'scripts/test-buyer-demand-rfq-postgres-setup.sql'
      - 'scripts/test-buyer-demand-rfq-postgres.sql'
      - 'scripts/test-buyer-demand-rfq-postgres.sh'
      - 'supabase/migrations/20261128020000_restrict_buyer_demand_phone_column.sql'
      - 'supabase/migrations/20261128030000_buyer_demand_to_bulk_rfq_transaction.sql'
      - '.github/workflows/bulk-rfq-autosuggest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crop-autocomplete:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Crop and seed suggestion regression checks
        run: node scripts/smoke-bulk-crop-suggestions.mjs
      - name: Custom units and optional delivery regression checks
        run: node scripts/smoke-bulk-order-custom-units.mjs
      - name: Wholesaler supply matching and privacy regression
        run: npm run test:wholesaler-matching
      - name: Buyer demand public phone privacy regression
        run: npm run test:buyer-demand-privacy
      - name: Buyer demand to wholesaler RFQ draft privacy regression
        run: npm run test:buyer-demand-rfq-conversion
      - name: Buyer demand to wholesaler RFQ transaction security regression
        run: npm run test:buyer-demand-rfq-transaction
      - name: Buyer demand RFQ review UI and API regression test
        run: npm run test:buyer-demand-rfq-ui-api
      - name: Bounded HTTP request body streaming unit test
        run: npm run test:read-limited-body
      - name: TypeScript integrity
        run: npx tsc --noEmit
      - name: Lint wholesaler Growth Engine
        run: npx eslint app/wholesaler/requests/page.tsx lib/growth/wholesaler-matching.mjs scripts/smoke-wholesaler-matching.mjs components/marketplace/BuyerDemandBoard.tsx scripts/smoke-buyer-demand-privacy.mjs scripts/smoke-buyer-demand-rfq-conversion.mjs scripts/smoke-buyer-demand-rfq-ui-api.mjs scripts/test-read-limited-body.mjs lib/http/read-limited-body.mjs components/marketplace/BuyerDemandRfqConversion.tsx app/api/buyer-demands/convert-to-rfq/route.ts lib/bulk-rfq/buyer-demand-conversion.mjs
      - name: Lint new autocomplete code
        run: npx eslint components/bulk-rfq/ProductNameAutocomplete.tsx components/bulk-rfq/MultiOrderForm.tsx lib/bulk-rfq/bangladesh-crop-suggestions.ts lib/bulk-rfq/units.ts lib/bulk-rfq/delivery-area.ts app/custom-order/page.tsx scripts/smoke-bulk-crop-suggestions.mjs scripts/smoke-bulk-order-custom-units.mjs
      - name: Production build compatibility
        run: npm run build

  buyer-demand-rfq-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply buyer privacy and RFQ conversion migrations to isolated PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: npm run test:buyer-demand-rfq-postgres

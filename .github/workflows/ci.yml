name: AGRIVA CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keep only the newest run for each branch/PR to avoid stale queued jobs.
concurrency:
  group: agriva-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Lint
        run: npm run lint -- --no-cache
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Smart Search smoke test syntax
        run: node --check scripts/smoke-smart-search.mjs
      - name: Category taxonomy SEO smoke test
        run: node scripts/smoke-taxonomy.mjs
      - name: Jobs application server-binding regression test
        run: npm run test:job-application-security
      - name: Payment-event RPC grant regression test
        run: npm run test:payment-event-grants
      - name: SSLCommerz payment route regression test
        run: npm run test:sslcommerz-payment
      - name: Marketplace live-inventory regression test
        run: npm run test:marketplace-live-inventory
      - name: Checkout error disclosure regression test
        run: npm run test:checkout-error-safety
      - name: API role and error disclosure regression test
        run: npm run test:api-role-hardening
      - name: Payment webhook hardening regression test
        run: npm run test:payment-webhook-hardening
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key

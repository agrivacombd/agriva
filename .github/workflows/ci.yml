name: AGRIVA CI
on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest run for each branch/PR to avoid stale queued jobs.
concurrency:
  group: agriva-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Record development dependency advisories
        shell: bash
        run: |
          npm audit --audit-level=moderate --json > dev-dependency-audit.json || true
          node scripts/report-dev-dependency-audit.mjs
      - name: Upload dependency advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-advisories
          path: dev-dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Seed and fertilizer calculator unit conversion and formula regression tests
        run: npm run test:calculators
      - name: Lint
        run: npm run lint -- --no-cache
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Bulk order agricultural product autocomplete regression
        run: node scripts/smoke-bulk-crop-suggestions.mjs
      - name: Invalid Supabase refresh-token cookie regression test
        run: npm run test:auth-refresh-token
      - name: Persisted privacy consent regression test
        run: npm run test:analytics-instrumentation
      - name: Direct COD shipping and ad landing readiness regression
        run: node scripts/smoke-direct-cod-shipping.mjs
      - name: Meta Pixel and COD conversion regression test
        run: npm run test:meta-conversions
      - name: Smart Search smoke test syntax
        run: node --check scripts/smoke-smart-search.mjs
      - name: Marketplace personalized recommendations regression test
        run: node scripts/smoke-marketplace-personalization.mjs
      - name: SEO article quality preflight regression
        run: node scripts/smoke-article-quality.mjs
      - name: Safe Markdown editor and publication integrity regression
        run: node scripts/smoke-article-markdown-editor.mjs
      - name: Content Trash, Restore and permanent deletion security regression
        run: node scripts/smoke-content-removal.mjs
      - name: Admin Article Queue filters and retired-table regression
        run: node scripts/smoke-article-review-queue.mjs
      - name: Editorial SEO workflow and navigation regression test
        run: node scripts/smoke-editorial-workflow.mjs
      - name: Homepage mobile layout regression test
        run: node scripts/smoke-home-mobile-responsive.mjs
      - name: Marketplace and Plant Market behavioural ranking regression test
        run: npm run test:product-rankings
      - name: Photo search privacy and matching regressions
        run: npm run test:visual-search
      - name: Public search config fallback and secret isolation
        run: npm run test:public-catalog-config
      - name: Local semantic visual-search regression
        run: npm run test:semantic-visual-search
      - name: Validate production visual-index smoke script
        run: node --check scripts/smoke-visual-search-production.mjs
      - name: Validate browser worker module syntax
        run: node --check public/workers/agriva-semantic-vision.mjs
      - name: Category taxonomy SEO smoke test
        run: node scripts/smoke-taxonomy.mjs
      - name: Jobs application server-binding regression test
        run: npm run test:job-application-security
      - name: Jobs database-unavailable state regression test
        run: npm run test:jobs-data-unavailable
      - name: Payment-event RPC grant regression test
        run: npm run test:payment-event-grants
      - name: SSLCommerz payment route regression test
        run: npm run test:sslcommerz-payment
      - name: Marketplace live-inventory regression test
        run: npm run test:marketplace-live-inventory
      - name: Marketplace SEO and indexability regression test
        run: npm run test:marketplace-seo
      - name: Sales-focused Related Products and Cart regression test
        run: node scripts/smoke-related-product-upsell.mjs
      - name: Private route indexing and buyer demands SEO regression test
        run: node scripts/smoke-private-page-indexing.mjs
      - name: Marketplace product landing SEO regression test
        run: npm run test:marketplace-product-seo
      - name: Packet and paddy shipping contract regression test
        run: node scripts/smoke-marketplace-shipping.mjs
      - name: Marketplace purchase quantity and COD action regression test
        run: npm run test:marketplace-purchase-options
      - name: Checkout error disclosure regression test
        run: npm run test:checkout-error-safety
      - name: API role and error disclosure regression test
        run: npm run test:api-role-hardening
      - name: Order notifications and admin click-through regression test
        run: node scripts/smoke-admin-order-notifications.mjs
      - name: Blog Learn Feed canonical routes and listing regression test
        run: node scripts/smoke-blog-learn-feed.mjs
      - name: Admin authorization regression test
        run: npm run test:admin-authorization
      - name: Sell My Harvest immediate publication regression test
        run: npm run test:sell-harvest-publication
      - name: Admin product RPC contract regression test
        run: npm run test:admin-product-rpc-contract
      - name: Super Admin operational queue regression test
        run: npm run test:super-admin-operations
      - name: Seller marketplace separation regression test
        run: npm run test:seller-marketplace-submission
      - name: Seller production schema compatibility regression test
        run: npm run test:seller-schema-compat
      - name: Seller product SEO editor regression test
        run: npm run test:seller-product-seo-editor
      - name: Marketplace four-image upload regression test
        run: npm run test:marketplace-product-image-gallery
      - name: Admin product image gallery regression test
        run: npm run test:admin-product-image-gallery
      - name: Payment webhook hardening regression test
        run: npm run test:payment-webhook-hardening
      - name: Disabled generic payment webhook regression test
        run: npm run test:payment-webhook-disabled
      - name: Reseller payout balance reservation regression test
        run: npm run test:reseller-payout-reservation
      - name: Public attribution RPC output regression test
        run: npm run test:attribution-rpc-output
      - name: Attribution resolution permissions regression test
        run: npm run test:attribution-resolution-permissions
      - name: Public RPC input validation regression test
        run: npm run test:public-rpc-input-hardening
      - name: Role-based signup and dashboard regression test
        run: npm run test:role-based-auth
      - name: Guest Auth provisioning boundary regression test
        run: npm run test:guest-auth-provisioning
      - name: Atomic COD checkout and cart workflow regression test
        run: npm run test:cod-cart
      - name: Module-access architecture regression test
        run: npm run test:module-access
      - name: Identity verification workflow regression test
        run: npm run test:identity-verification
      - name: Admin application history and seller approval regression test
        run: npm run test:admin-application-management
      - name: Client TRUNCATE privilege regression test
        run: npm run test:truncate-privileges
      - name: Green Exchange security and route regression test
        run: npm run test:green-exchange-security
      - name: Plant Market live inventory and SEO regression test
        run: npm run test:plant-market
      - name: Plant Market independent checkout and order lifecycle regression test
        if: hashFiles('scripts/smoke-plant-market-checkout.mjs') != ''
        run: npm run test:plant-market-checkout
      - name: Plant Market public-read RLS regression test
        run: npm run test:plant-market-public-read-rls
      - name: Green Living schema, privacy, and SEO regression test
        run: npm run test:green-living-platform
      - name: Phase 1 SEO architecture regression test
        run: npm run test:seo-phase1
      - name: CV Builder versioned storage migration regression test
        run: npm run test:cv-builder-migration
      - name: Plant science catalogue integrity regression test
        run: npm run test:plant-science-catalog
      - name: Plant science nomenclature audit
        run: npm run audit:plant-science-catalog
      - name: Plant science review queue validation
        run: npm run test:plant-science-review-queue
      - name: Cross-linked AGRIVA knowledge hubs regression
        run: node scripts/smoke-knowledge-hub-links.mjs
      - name: Learn hub SEO, answer content, breadcrumbs and schema validation
        run: node scripts/smoke-learn-seo-aeo.mjs
      - name: Learn slug navigation and canonical route regression
        run: node scripts/smoke-learn-route.mjs
      - name: Plant disease case details mobile accessibility regression
        run: node scripts/smoke-plant-disease-navigation.mjs
      - name: Plant Science SEO and AEO regression test
        run: npm run test:plant-science-seo-aeo
      - name: Official AGRIVA logo and PWA icon SEO regression test
        run: npm run test:brand-assets
      - name: Admin AI product SEO security regression test
        run: node scripts/smoke-admin-ai-product-seo.mjs
      - name: Admin 2.0 command center regression test
        run: npm run test:admin-command-center
      - name: Admin demand intelligence regression test
        run: npm run test:admin-demand-intelligence
      - name: Admin growth intelligence regression test
        run: npm run test:admin-growth-intelligence
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key

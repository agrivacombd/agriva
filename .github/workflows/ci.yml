name: AGRIVA CI
on:
  push:
    branches: [main]
  pull_request:

# Keep only the newest run for each branch/PR to avoid stale queued jobs.
concurrency:
  group: agriva-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --fetch-retries=2 --fetch-timeout=120000
      - name: Audit all locked dependencies
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint -- --no-cache
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Invalid Supabase refresh-token cookie regression test
        run: npm run test:auth-refresh-token
      - name: Smart Search smoke test syntax
        run: node --check scripts/smoke-smart-search.mjs
      - name: Category taxonomy SEO smoke test
        run: node scripts/smoke-taxonomy.mjs
      - name: Jobs application server-binding regression test
        run: npm run test:job-application-security
      - name: Jobs database-unavailable state regression test
        run: npm run test:jobs-data-unavailable
      - name: Payment-event RPC grant regression test
        run: npm run test:payment-event-grants
      - name: SSLCommerz payment route regression test
        run: npm run test:sslcommerz-payment
      - name: Marketplace live-inventory regression test
        run: npm run test:marketplace-live-inventory
      - name: Marketplace SEO and indexability regression test
        run: npm run test:marketplace-seo
      - name: Marketplace product landing SEO regression test
        run: npm run test:marketplace-product-seo
      - name: Checkout error disclosure regression test
        run: npm run test:checkout-error-safety
      - name: API role and error disclosure regression test
        run: npm run test:api-role-hardening
      - name: Admin authorization regression test
        run: npm run test:admin-authorization
      - name: Sell My Harvest immediate publication regression test
        run: npm run test:sell-harvest-publication
      - name: Admin product RPC contract regression test
        run: npm run test:admin-product-rpc-contract
      - name: Super Admin operational queue regression test
        run: npm run test:super-admin-operations
      - name: Seller marketplace separation regression test
        run: npm run test:seller-marketplace-submission
      - name: Seller production schema compatibility regression test
        run: npm run test:seller-schema-compat
      - name: Seller product SEO editor regression test
        run: npm run test:seller-product-seo-editor
      - name: Marketplace four-image upload regression test
        run: npm run test:marketplace-product-image-gallery
      - name: Admin product image gallery regression test
        run: npm run test:admin-product-image-gallery
      - name: Payment webhook hardening regression test
        run: npm run test:payment-webhook-hardening
      - name: Disabled generic payment webhook regression test
        run: npm run test:payment-webhook-disabled
      - name: Reseller payout balance reservation regression test
        run: npm run test:reseller-payout-reservation
      - name: Public attribution RPC output regression test
        run: npm run test:attribution-rpc-output
      - name: Attribution resolution permissions regression test
        run: npm run test:attribution-resolution-permissions
      - name: Public RPC input validation regression test
        run: npm run test:public-rpc-input-hardening
      - name: Role-based signup and dashboard regression test
        run: npm run test:role-based-auth
      - name: Module-access architecture regression test
        run: npm run test:module-access
      - name: Identity verification workflow regression test
        run: npm run test:identity-verification
      - name: Client TRUNCATE privilege regression test
        run: npm run test:truncate-privileges
      - name: Green Exchange security and route regression test
        run: npm run test:green-exchange-security
      - name: Plant Market live inventory and SEO regression test
        run: npm run test:plant-market
      - name: Plant Market independent checkout and order lifecycle regression test
        if: hashFiles('scripts/smoke-plant-market-checkout.mjs') != ''
        run: npm run test:plant-market-checkout
      - name: Plant Market public-read RLS regression test
        run: npm run test:plant-market-public-read-rls
      - name: Green Living schema, privacy, and SEO regression test
        run: npm run test:green-living-platform
      - name: Phase 1 SEO architecture regression test
        run: npm run test:seo-phase1
      - name: CV Builder versioned storage migration regression test
        run: npm run test:cv-builder-migration
      - name: Plant science catalogue integrity regression test
        run: npm run test:plant-science-catalog
      - name: Plant science nomenclature audit
        run: npm run audit:plant-science-catalog
      - name: Plant science review queue validation
        run: npm run test:plant-science-review-queue
      - name: Plant Science SEO and AEO regression test
        run: npm run test:plant-science-seo-aeo
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-placeholder-key

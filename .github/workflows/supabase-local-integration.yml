name: AGRIVA Local Supabase Auth & PostgREST Integration

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/test-buyer-demand-rfq-supabase*"
      - ".github/workflows/supabase-local-integration.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/test-buyer-demand-rfq-supabase*"
      - ".github/workflows/supabase-local-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agriva-local-supabase-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-postgrest-integration:
    name: Local Supabase Auth + PostgREST (synthetic data)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0

      - name: Initialize and validate local Supabase config
        env:
          SUPABASE_EXPERIMENTAL_STACK: "1"
        run: |
          supabase --version
          supabase init --force
          supabase config validate

      - name: Keep project migrations out of stack bootstrap
        run: |
          mv supabase/migrations "$RUNNER_TEMP/agriva-migrations"
          mkdir -p supabase/migrations

      - name: Start local Auth and PostgREST services
        run: |
          supabase start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit

      - name: Export local-only connection details
        run: |
          supabase status --env \
            --override-name API_URL=SUPABASE_URL \
            --override-name ANON_KEY=SUPABASE_ANON_KEY \
            --override-name SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY \
            --override-name DB_URL=SUPABASE_DB_URL >> "$GITHUB_ENV"

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Restore and prepare isolated synthetic schema
        env:
          PGPASSWORD: postgres
        run: |
          rm -rf supabase/migrations
          mv "$RUNNER_TEMP/agriva-migrations" supabase/migrations
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/test-buyer-demand-rfq-supabase-fixture.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261128020000_restrict_buyer_demand_phone_column.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261128030000_buyer_demand_to_bulk_rfq_transaction.sql
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"

      - name: Verify real Auth and PostgREST behavior
        run: node scripts/test-buyer-demand-rfq-supabase.mjs

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop || true

name: Marketplace Browser E2E (isolated)
on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "supabase/migrations/**"
      - "scripts/sql/**"
      - "scripts/e2e/**"
      - ".github/workflows/marketplace-browser-e2e.yml"
      - "package.json"
      - "package-lock.json"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: marketplace-browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  marketplace-full-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      PGHOST: 127.0.0.1
      PGPORT: 54323
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.81.3
      - name: Install locked dependencies and PostgreSQL client
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Install ephemeral Playwright runner and Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Initialize local-only Supabase with test Auth configuration
        run: |
          supabase init --force
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("supabase/config.toml")
          config = path.read_text()

          def set_value(section_name, key, value):
              header = f"[{section_name}]"
              match = re.search(rf"(?m)^\\[{re.escape(section_name)}\\]\\s*$", config)
              if match:
                  next_section = re.search(r"(?m)^\\[[^\\]]+\\]\\s*$", config[match.end():])
                  end = match.end() + next_section.start() if next_section else len(config)
                  section = config[match.end():end]
                  setting = re.search(rf"(?m)^\\s*{re.escape(key)}\\s*=.*$", section)
                  if setting:
                      section = section[:setting.start()] + f"{key} = {value}" + section[setting.end():]
                  else:
                      section = f"\\n{key} = {value}" + section
                  return config[:match.end()] + section + config[end:]
              suffix = "" if not config.strip() else "\\n"
              return config + suffix + header + f"\\n{key} = {value}\\n"

          for section, key, value in [
              ("db", "port", "54323"),
              ("db.migrations", "enabled", "false"),
              ("auth", "enabled", "true"),
              ("auth", "site_url", '"http://127.0.0.1:3000"'),
              ("auth", "enable_signup", "true"),
              ("auth.email", "enable_signup", "true"),
              ("auth.email", "enable_confirmations", "false"),
          ]:
              config = set_value(section, key, value)

          path.write_text(config)
          print("Configured a disposable local Supabase DB and email/password Auth; email confirmations are disabled only for this runner.")
          PY
      - name: Start isolated Supabase PostgreSQL, Auth and PostgREST
        run: supabase start -x realtime,imgproxy,mailpit,storage,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Export disposable local Supabase connection settings
        shell: bash
        run: |
          supabase status -o env > /tmp/supabase-status.env
          source /tmp/supabase-status.env
          test -n "$API_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          E2E_SEEDED_PASSWORD="$(openssl rand -hex 24)Aa1!"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SEEDED_PASSWORD=$E2E_SEEDED_PASSWORD"
            echo "E2E_ADMIN_EMAIL=marketplace-admin-${GITHUB_RUN_ID}@example.test"
            echo "E2E_SELLER_EMAIL=marketplace-seller-${GITHUB_RUN_ID}@example.test"
            echo "E2E_BUYER_EMAIL=marketplace-buyer-${GITHUB_RUN_ID}@example.test"
            echo "E2E_BASE_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"
      - name: Replay every AGRIVA migration against the isolated database
        run: |
          bash scripts/sql/replay-all-supabase-migrations.sh
          psql -X -v ON_ERROR_STOP=1 -f scripts/sql/marketplace-seller-organization-full-schema-test.sql
      - name: Seed test-only Auth identities and Marketplace fixtures
        run: |
          node scripts/e2e/seed-marketplace-browser-e2e.mjs | tee /tmp/marketplace-e2e-seed.log
          grep '^E2E_PRODUCT_ID=' /tmp/marketplace-e2e-seed.log >> "$GITHUB_ENV"
      - name: Build application against local Supabase only
        run: env -u SUPABASE_SERVICE_ROLE_KEY npm run build
      - name: Start local application without the service-role key
        run: |
          env -u SUPABASE_SERVICE_ROLE_KEY npm run start -- --hostname 127.0.0.1 > /tmp/agriva-next.log 2>&1 &
          echo $! > /tmp/agriva-next.pid
      - name: Run signup, login, seller submission, COD, cancellation/restock and admin browser E2E
        run: node scripts/e2e/marketplace-full-browser-e2e.mjs
      - name: Upload application log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-full-e2e-app-log
          path: /tmp/agriva-next.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup || true

name: Editorial SEO draft audit
on:
  pull_request:
    paths:
      - "content/articles/drafts/**"
      - "scripts/audit-editorial-drafts.mjs"
      - ".github/workflows/editorial-seo.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editorial-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit unpublished articles
        run: node scripts/audit-editorial-drafts.mjs
